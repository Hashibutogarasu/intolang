[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
analysis = { version = "0.1.0", path = "../analysis" }
backend = { path = "../backend" }
errors = { version = "0.1.0", path = "../errors" }
intovm = { version = "0.1.0", path = "../intovm" }
ipc = { version = "0.1.0", path = "../ipc" }
package = { version = "0.1.0", path = "../package" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
