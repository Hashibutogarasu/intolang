[package]
name = "lsp"
version = "0.1.0"
edition = "2024"

[lib]
name = "lsp"
path = "src/lib.rs"

[[bin]]
name = "into-lsp"
path = "src/main.rs"

[dependencies]
ipc = { version = "0.1.0", path = "../ipc" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
