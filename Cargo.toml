[package]
name = "intolang"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
compiler = { path = "apps/compiler" }
backend = { path = "packages/backend" }

[workspace]
members = ["apps/compiler", "packages/backend", "packages/lld", "packages/moduler"]
