[package]
name = "intolang"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
errors = { version = "0.1.0", path = "packages/errors" }
compiler = { path = "apps/compiler" }
backend = { path = "packages/backend" }
bundle = { version = "0.1.0", path = "packages/bundle" }
formatter = { version = "0.1.0", path = "packages/formatter" }
testing = { version = "0.1.0", path = "packages/testing" }
moduler = { version = "0.1.0", path = "packages/moduler" }
intovm = { version = "0.1.0", path = "packages/intovm" }
native = { version = "0.1.0", path = "packages/native" }
package = { version = "0.1.0", path = "packages/package" }
progress = { version = "0.1.0", path = "packages/progress" }

[workspace]
members = ["apps/compiler", "packages/analysis", "packages/ast", "packages/backend", "packages/bundle", "packages/codegen", "packages/errors", "packages/formatter", "packages/intovm", "packages/ipc", "packages/lld", "packages/lsp", "packages/moduler", "packages/native", "packages/package", "packages/parser", "packages/progress", "packages/testing", "packages/tokenizer", "packages/types", "packages/wasm"]
exclude = ["packages/lsp/packages/zed"]
