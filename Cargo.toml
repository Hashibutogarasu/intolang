[package]
name = "intolang"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
compiler = { path = "apps/compiler" }
backend = { path = "packages/backend" }
formatter = { version = "0.1.0", path = "packages/formatter" }
testing = { version = "0.1.0", path = "packages/testing" }
moduler = { version = "0.1.0", path = "packages/moduler" }
intovm = { version = "0.1.0", path = "packages/intovm" }
native = { version = "0.1.0", path = "packages/native" }

[workspace]
members = ["apps/compiler", "packages/ast", "packages/backend", "packages/codegen", "packages/formatter", "packages/intovm", "packages/lld", "packages/moduler", "packages/native", "packages/parser", "packages/testing", "packages/tokenizer", "packages/types"]
