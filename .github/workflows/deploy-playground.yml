name: Deploy the playground

on:
  push:
    branches: [main]
    paths:
      - apps/playground/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - .github/workflows/deploy-playground.yml
  workflow_dispatch:

concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build in the playground dev shell and deploy the output
        run: |
          nix develop .#playground -c sh -ec '
            pnpm --dir apps/playground install --frozen-lockfile
            vercel=apps/playground/node_modules/.bin/vercel
            $vercel pull --yes --environment=production
            $vercel build --prod
            $vercel deploy --prebuilt --prod
          '
